name = "rabyte-tech"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rabyte_d1"
database_id = "bbe9d60f-fd8d-4ae9-b772-33180c1b17b8"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "rabyte-store-assets"

[[kv_namespaces]]
binding = "KV"
id = "d77e4aec3bc34a148a853a3d7c9097af"
